<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Timezone Board — Dispetcher paneli</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0A0F1C;
    --panel: #121A2B;
    --panel-2: #17203A;
    --border: #26314E;
    --amber: #F4A83D;
    --amber-dim: #8A6428;
    --text: #EAEFF7;
    --muted: #7C8AA8;
    --green: #4CBB7A;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(244,168,61,0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(76,187,122,0.05), transparent 40%);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }

  .wrap{
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 18px;
    margin-bottom: 22px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .title-block .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .title-block h1{
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.01em;
    color: var(--green);
  }

  .local-info{
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    font-size: 12px;
  }

  .local-info .local-label{
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 10px;
  }

  .local-info .local-time{
    color: #4C8DF4;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  /* ===== Board: 4 columns, clock on top of each ===== */
  .board{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .col{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 16px 16px;
    box-shadow: inset 0 3px 0 var(--zone-color, var(--amber));
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .zone-name{
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.01em;
  }

  .zone-offset{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    margin-top: 2px;
    opacity: 0.85;
  }

  .clock{
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .flip-group{
    display: flex;
    gap: 1px;
  }

  .digit{
    position: relative;
    display: inline-block;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    width: 22px;
    height: 34px;
    line-height: 34px;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
  }

  .digit::after{
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: rgba(0,0,0,0.35);
  }

  .digit.flip{
    animation: flipDigit 0.35s ease;
  }

  @keyframes flipDigit{
    0%{ transform: rotateX(0deg); }
    50%{ transform: rotateX(90deg); opacity: 0.4; }
    100%{ transform: rotateX(0deg); }
  }

  .colon{
    font-size: 20px;
    font-weight: 600;
    color: var(--amber-dim);
    align-self: center;
  }

  .meridiem{
    font-size: 12px;
    font-weight: 700;
    margin-left: 2px;
  }

  .date-row{
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  .eta-row{
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    width: 100%;
  }

  .eta-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .eta-input{
    width: 70px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    text-align: center;
    padding: 4px 6px;
    outline: none;
  }

  .eta-input:focus{
    border-color: var(--amber);
  }

  .eta-input::-webkit-outer-spin-button,
  .eta-input::-webkit-inner-spin-button{
    -webkit-appearance: none;
    margin: 0;
  }

  .eta-result{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    min-height: 16px;
  }

  .states{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
  }

  .state-pill{
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    margin: 0 6px;
    display: inline-block;
  }

  /* ===== Legend ===== */
  .legend{
    margin-top: 24px;
    padding: 18px 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0 20px;
  }

  .legend-col{
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding-right: 16px;
    border-right: 1px solid var(--border);
  }

  .legend-col:last-child{
    border-right: none;
  }

  .legend-col-title{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 2px;
  }

  .legend-item{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .legend-abbr{
    font-weight: 600;
  }

  footer{
    margin-top: 26px;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.6;
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
  }

  @media (max-width: 900px){
    .board{
      grid-template-columns: repeat(2, 1fr);
    }
    .legend{
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 20px;
    }
    .legend-col{
      border-right: none;
      padding-right: 0;
    }
  }

  @media (max-width: 560px){
    .board{
      grid-template-columns: 1fr;
    }
    header{
      flex-direction: column;
      align-items: flex-start;
    }
    .local-info{
      text-align: left;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title-block">
        <div class="eyebrow">Eastern (ET)</div>
        <h1 id="hero-time">—</h1>
      </div>
      <div class="local-info">
        <div class="local-label">Tashkent (local)</div>
        <div class="local-time" id="local-time">—</div>
      </div>
    </header>

    <div class="board" id="board"></div>

    <div class="legend" id="legend"></div>
  </div>

<script>
const stateNames = {
  ME: "Maine", NH: "New Hampshire", VT: "Vermont", MA: "Massachusetts", RI: "Rhode Island",
  CT: "Connecticut", NY: "New York", NJ: "New Jersey", PA: "Pennsylvania", DE: "Delaware",
  MD: "Maryland", DC: "Washington D.C.", VA: "Virginia", WV: "West Virginia", NC: "North Carolina",
  SC: "South Carolina", GA: "Georgia", FL: "Florida", OH: "Ohio", MI: "Michigan",
  IN: "Indiana", KY: "Kentucky",
  WI: "Wisconsin", IL: "Illinois", MO: "Missouri", IA: "Iowa", MN: "Minnesota",
  ND: "North Dakota", SD: "South Dakota", NE: "Nebraska", KS: "Kansas", OK: "Oklahoma",
  TX: "Texas", AR: "Arkansas", LA: "Louisiana", MS: "Mississippi", AL: "Alabama", TN: "Tennessee",
  MT: "Montana", WY: "Wyoming", ID: "Idaho", UT: "Utah", CO: "Colorado", NM: "New Mexico", AZ: "Arizona",
  WA: "Washington", OR: "Oregon", CA: "California", NV: "Nevada"
};

const zoneColors = {
  "Pacific (PT)": "#4C8DF4",
  "Mountain (MT)": "#E85C5C",
  "Central (CT)": "#F4C542",
  "Eastern (ET)": "#4CBB7A"
};

const zones = [
  { name: "Pacific (PT)",  tz: "America/Los_Angeles", states: "WA, OR, CA, NV" },
  { name: "Mountain (MT)", tz: "America/Denver",      states: "MT, WY, ID, UT, CO, NM, AZ" },
  { name: "Central (CT)",  tz: "America/Chicago",     states: "ND, SD, NE, KS, OK, TX, MN, IA, WI, IL, MO, AR, LA, MS, AL, TN" },
  { name: "Eastern (ET)",  tz: "America/New_York",    states: "ME, NH, VT, MA, RI, CT, NY, NJ, PA, DE, MD, DC, VA, WV, NC, SC, GA, FL, OH, MI, IN, KY" }
];

const board = document.getElementById('board');
const prevValues = {};

zones.forEach((z, i) => {
  const color = zoneColors[z.name] || 'var(--amber)';
  const col = document.createElement('div');
  col.className = 'col';
  col.style.setProperty('--zone-color', color);
  col.innerHTML = `
    <div class="zone-name" style="color:${color}">${z.name}</div>
    <div class="zone-offset" id="offset-${i}" style="color:${color}">—</div>
    <div class="clock">
      <div class="flip-group" id="hh-${i}"></div>
      <div class="colon">:</div>
      <div class="flip-group" id="mm-${i}"></div>
      <div class="colon">:</div>
      <div class="flip-group" id="ss-${i}"></div>
      <span class="meridiem" id="ampm-${i}" style="color:${color}"></span>
    </div>
    <div class="date-row" id="date-${i}"></div>
    <div class="eta-row">
      <label class="eta-label" for="eta-input-${i}">ETA +min</label>
      <input type="number" class="eta-input" id="eta-input-${i}" min="0" placeholder="0" inputmode="numeric">
      <div class="eta-result" id="eta-result-${i}" style="color:${color}">—</div>
    </div>
  `;
  board.appendChild(col);
  prevValues[i] = { hh: '', mm: '', ss: '' };

  col.querySelector(`#eta-input-${i}`).addEventListener('input', () => {
    updateETA(i, z, new Date());
  });
});

function renderDigits(container, str, prevStr) {
  container.innerHTML = '';
  for (let idx = 0; idx < str.length; idx++) {
    const span = document.createElement('span');
    span.className = 'digit';
    span.textContent = str[idx];
    if (prevStr && prevStr[idx] !== str[idx]) {
      span.classList.add('flip');
    }
    container.appendChild(span);
  }
}

function getOffsetLabel(tz) {
  try {
    const fmt = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'shortOffset' });
    const parts = fmt.formatToParts(new Date());
    const off = parts.find(p => p.type === 'timeZoneName');
    return off ? off.value.replace('GMT', 'GMT') : '';
  } catch (e) {
    return '';
  }
}

function tick() {
  const now = new Date();

  const localFmt = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Tashkent',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
  });
  document.getElementById('local-time').textContent = localFmt.format(now);

  const heroFmt = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
  });
  document.getElementById('hero-time').textContent = heroFmt.format(now);

  zones.forEach((z, i) => {
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: z.tz,
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
    });
    const parts = fmt.formatToParts(now);
    const get = (type) => parts.find(p => p.type === type)?.value || '';

    let hh = get('hour');
    if (hh.length < 2) hh = '0' + hh;
    const mm = get('minute');
    const ss = get('second');
    const ampm = get('dayPeriod');

    const prev = prevValues[i];
    renderDigits(document.getElementById(`hh-${i}`), hh, prev.hh);
    renderDigits(document.getElementById(`mm-${i}`), mm, prev.mm);
    renderDigits(document.getElementById(`ss-${i}`), ss, prev.ss);
    document.getElementById(`ampm-${i}`).textContent = ampm;

    prevValues[i] = { hh, mm, ss };

    document.getElementById(`offset-${i}`).textContent = getOffsetLabel(z.tz);

    const dateFmt = new Intl.DateTimeFormat('en-US', {
      timeZone: z.tz, weekday: 'short', month: 'short', day: 'numeric'
    });
    document.getElementById(`date-${i}`).textContent = dateFmt.format(now);

    updateETA(i, z, now);
  });
}

function updateETA(i, z, now) {
  const input = document.getElementById(`eta-input-${i}`);
  const result = document.getElementById(`eta-result-${i}`);
  const miles = parseFloat(input.value);
  if (!miles || miles <= 0) {
    result.textContent = '—';
    return;
  }
  const AVG_SPEED_MPH = 70;
  const hours = miles / AVG_SPEED_MPH;
  const etaDate = new Date(now.getTime() + hours * 3600000);

  const zoneNowFmt = new Intl.DateTimeFormat('en-CA', { timeZone: z.tz });
  const zoneEtaFmt = new Intl.DateTimeFormat('en-CA', { timeZone: z.tz });
  const nowDay = zoneNowFmt.format(now);
  const etaDay = zoneEtaFmt.format(etaDate);

  const timeFmt = new Intl.DateTimeFormat('en-US', {
    timeZone: z.tz, hour: '2-digit', minute: '2-digit', hour12: true
  });

  if (etaDay === nowDay) {
    result.textContent = `ETA: ${timeFmt.format(etaDate)}`;
  } else {
    const dateFmt = new Intl.DateTimeFormat('en-US', {
      timeZone: z.tz, weekday: 'short', month: 'short', day: 'numeric'
    });
    result.textContent = `ETA: ${dateFmt.format(etaDate)} · ${timeFmt.format(etaDate)}`;
  }
}

function buildLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = zones.map(z => {
    const color = zoneColors[z.name] || 'var(--amber)';
    const items = z.states.split(', ').map(abbr =>
      `<span class="legend-item"><span class="legend-abbr" style="color:${color}">${abbr}</span> — ${stateNames[abbr] || abbr}</span>`
    ).join('');
    return `<div class="legend-col">
      <div class="legend-col-title" style="color:${color}">${z.name}</div>
      ${items}
    </div>`;
  }).join('');
}
buildLegend();

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
